[project]
name = "psop-standard-library-service"
version = "0.1.0"
description = "Standard-library API and frontend service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "boto3>=1.34.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
